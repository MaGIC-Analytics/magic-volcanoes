apiVersion: apps/v1
kind: Deployment
metadata:
  name: magic-volcanoes
  namespace: volcanoes-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: magic-volcanoes
  template:
    metadata:
      labels:
        app: magic-volcanoes
    spec:
      containers:
        - name: volcanoes-app
          image: ghcr.io/magic-analytics/magic-volcanoes:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2048Mi"
